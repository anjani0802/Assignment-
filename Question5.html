<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HorizontalList</title>
    <style>
        ul {
            padding: 0;
            margin: 0;
            display: flex;
        }
        li{
            margin: auto;
        }
    </style>
</head>
<body>
    <ul>
        <p>Horizontal List</p>
        <li>name</li>
        <li>roll no</li>
        <li>class</li>
        <li>branch</li>
    </ul>
</body>
</html>
